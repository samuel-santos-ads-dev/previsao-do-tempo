<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="shortcut icon" href="midias/favicon_io/favicon.ico" type="image/x-icon">
    <link rel="stylesheet" href="estilos/estilo.css">
    <title>Previsão do Tempo</title>
</head>
<body>

    <main class="conteiner">
        <abbr title="Clima da sua cidade">
            <input type="text" name="cidade" id="cidade" required placeholder="Digite o nome da cidade">
            <button class="botaobuscar">
                <!-- <img class="lupabuscar" src="midias/lupa.png" alt="Icone de lupa"> -->
                <svg class="lupabuscar" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512"><path d="M456.69,421.39,362.6,327.3a173.81,173.81,0,0,0,34.84-104.58C397.44,126.38,319.06,48,222.72,48S48,126.38,48,222.72s78.38,174.72,174.72,174.72A173.81,173.81,0,0,0,327.3,362.6l94.09,94.09a25,25,0,0,0,35.3-35.3ZM97.92,222.72a124.8,124.8,0,1,1,124.8,124.8A124.95,124.95,0,0,1,97.92,222.72Z"/></svg>
            </button>

            <div class="caixamaior">
                <h2 id="titulolocal">Tempo em Paço do Lumiar</h2>
                <p id="temperatura">34°C</p>
                <div class="caixamenor">
                    <img src="midias/nublado.png" alt="icone de clima atual" id="iconeclima">
                    <p id="textoprevisao">Nublado</p>
                </div>
                <p id="umidade">Umidade: 80%</p>
            </div>
        </abbr>
    </main>

    <footer>
        <a href="https://www.linkedin.com/in/samuel-santos-ads-dev/" target="_blank" rel="author noopener noreferrer">&copy; Samuel Santos <span id="ano"></span></a>
    </footer>
